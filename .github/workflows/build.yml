name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Restore signing key
        run: echo "$KEYSTORE_B64" | base64 -d > app/aspire-debug.keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - name: Run tests
        run: gradle :app:testDebugUnitTest
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Show signing SHA-1 (register this in Google Cloud once)
        run: keytool -list -v -keystore app/aspire-debug.keystore -storepass android | grep SHA1
      - uses: actions/upload-artifact@v4
        with:
          name: AspireJobCards-apk
          path: app/build/outputs/apk/debug/app-debug.apk
